# ============================================================================
#  arXiv nightly digest — configuration
#  Edit this file freely. Nothing else needs to change.
#
#  How scoring works:
#    score = (author points) + (topic points) + (bonuses)
#  Papers are ranked by score; the top ones get full abstracts sent to the
#  model, which picks the 5 best, flags likely-influential work, and writes
#  the trend summary.
# ============================================================================

[settings]
feeds = []                    # set in setup step 3, e.g. ["quant-ph"] or ["cond-mat.soft"]
max_candidates = 28           # new + cross-listed papers that get full abstracts
max_replacements = 6          # abstract slots reserved for replacements (kept separate
                              #   so v2 updates can never crowd out tonight's new papers)
min_score = 2.0               # papers below this are ignored entirely
include_replacements = true   # v2/v3 updates — only surfaced if they clear replacement_min_score
replacement_min_score = 8.0   # replacements are noisy, so hold them to a higher bar
author_points = 5.0           # points per matched author from the list below
author_points_first_last = 2.0  # extra if the matched author is first or last author
title_multiplier = 2.0        # topic keyword hits in the TITLE count this much more
review_bonus = 3.0            # likely review / colloquium / lecture notes
cross_list_bonus = 0.5        # per category outside the archives you follow


# Where to save the PDFs of papers you mark as wanted. Leave empty to save
# nothing and just keep the links. "~" is expanded.
#   download_dir = "~/Papers/arxiv"
# Coming soon: sending them straight into Zotero. For now this is a plain
# folder, which Zotero can watch and auto-import from
# (Zotero: Settings -> Advanced -> Files and Folders -> Linked Attachment Base
# Directory, or drag the folder into a collection).
download_dir = ""

# ============================================================================
#  READER — who the digest is written for. This is injected into the briefing
#  every night, and it is the single biggest lever on what gets picked.
#  Setup step 2 fills it in from a researcher's publication record, or write
#  your own: field, subfields, and what you care about.
# ============================================================================

[reader]
description = """
A researcher in the arXiv sections configured above.

Setup step 2 replaces this with a real description built from a publication
record, and that is what makes the digest good. Until then the model has
nothing to go on but the topic keywords below, so the picks will be generic.
"""

# ============================================================================
#  AUTHORS — people whose papers you want to see regardless of topic
#
#  Write names naturally: "Ada Lovelace", "A. Lovelace", and
#  "Lovelace, Ada" all match. Matching uses LAST NAME + FIRST INITIAL, so
#  common surnames can occasionally false-positive; the digest always shows
#  which name matched so you can spot it. Delete anyone you don't care about —
#  a shorter, sharper list gives better digests than a long one.
#
#  This is a STARTER list assembled from the areas you named. Prune it on the
#  first few nights; `/arxiv-learn` will also suggest edits from your picks.
# ============================================================================

[authors]
# Empty on purpose: a shipped list of one person's field is worse than no list.
# Setup step 2 ("whose work should it follow?") fills this in from a real
# publication record — that is the recommended route.
#
# To start from a hand-picked list instead:
#     python3 examples.py list
#     python3 examples.py add quantum-information
names = []


# ============================================================================
#  TOPICS — keyword groups. These defaults lean towards physics;
#  replace them with whatever your field actually uses. Setup step 2
#  also adds an 'own-corpus' group from real paper titles.
#  keyword groups. Each `keywords` entry is a case-insensitive
#  regular expression matched against the title and abstract. A group scores
#  its `weight` once, plus a smaller amount for each extra distinct hit, and
#  title hits are multiplied by settings.title_multiplier.
#
#  Add/remove groups at will. To mute a topic, set weight = 0.
# ============================================================================

[[topics]]
name = "reviews"
weight = 3.0
# Deliberately narrow: bare "review" and "perspective" appear in ordinary
# abstracts ("from the perspective of...") and flooded the digest.
keywords = [
  "\\bwe review\\b", "\\bthis review\\b", "\\breview (of|article|on)\\b",
  "\\breviewed here\\b", "Rev\\.? Mod\\.? Phys", "lecture notes",
  "\\bcolloquium\\b", "\\btutorial\\b", "pedagogical", "\\bprimer\\b",
  "\\bwe (give|provide) an overview\\b", "\\bself-contained introduction\\b",
]

# Field-specific topic groups live in examples/ so this file assumes nothing:
#     examples/quantum-information.toml   error correction, algorithms, hardware
#     examples/condensed-matter.toml      superconductivity, spin liquids, soft matter
# Merge whichever fits with `python3 examples.py add <name>`, or let setup
# step 2 generate an "own-corpus" group from a real set of paper titles.
