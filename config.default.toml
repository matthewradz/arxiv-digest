# ============================================================================
#  TOPICS — keyword groups. Each `keywords` entry is a case-insensitive
#  regular expression matched against the title and abstract. A group scores
#  its `weight` once, plus a smaller amount for each extra distinct hit, and
#  title hits are multiplied by settings.title_multiplier.
#
#  Add/remove groups at will. To mute a topic, set weight = 0.
# ============================================================================

[[topics]]
name = "gauge-theories"
weight = 4.0
keywords = [
  "gauge theor", "lattice gauge", "emergent gauge", "gauge field",
  "fracton", "deconfin", "confinement transition", "higher-form symmetry",
  "Chern-Simons", "\\bdualit(y|ies)\\b", "\\bZ_?2 gauge", "compact QED",
  "tensor gauge", "subsystem symmetry", "topological field theor",
]

[[topics]]
name = "critical-phenomena"
weight = 4.0
keywords = [
  "critical exponent", "criticalit", "renormalization group", "\\bRG flow",
  "universality class", "scaling function", "conformal field theor", "\\bCFT\\b",
  "fixed point", "quantum critical", "tricritical", "multicritical",
  "Kosterlitz", "\\bBKT\\b", "finite-size scaling", "epsilon expansion",
  "large-N expansion", "anomalous dimension", "crossover exponent",
]

